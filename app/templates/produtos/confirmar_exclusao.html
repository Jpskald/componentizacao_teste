<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Exclusão</title>
</head>
<body>
    <h1>Excluir Produto</h1>
    <p>Tem certeza de que deseja excluir o produto <strong>"{{ produto.nome }}"</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sim, excluir</button>
        <a href="{% url 'produto_listar' %}">Cancelar</a>
    </form>
</body>
</html>
