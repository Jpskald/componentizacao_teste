<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <!-- Menu de Navegação -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">📦 Sistema de Estoque</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'produto_listar' %}">Produtos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'categoria_listar' %}">Categorias</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'movimentacao_listar' %}">Movimentações</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Container Principal onde as páginas serão injetadas -->
    <div class="container mt-5 mb-5">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                {% block conteudo %}
                {% endblock %}
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
